apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup-task
spec:
  description: This task cleans up the workspace after the pipeline finishes.
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: alpine:latest
      script: |
        echo "Cleaning up the workspace..."
        rm -rf $(workspaces.source.path)/*

---

apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose-test-task
spec:
  description: This task runs unit tests using the nose framework.
  workspaces:
    - name: source
  steps:
    - name: install-dependencies
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install nose

    - name: run-nose-tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        nosetests -v
